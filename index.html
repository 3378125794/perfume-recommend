<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>你今天闻起来真棒 — 心情香水推荐</title>
    <style>
        :root {
            --bg: #fafaf9;
            --surface: #ffffff;
            --text: #1a1a1a;
            --text-secondary: #6b6b6b;
            --text-tertiary: #999999;
            --border: #e8e8e6;
            --border-hover: #1a1a1a;
            --accent: #1a1a1a;
            --tag-bg: #f3f3f1;
            --tag-hover-bg: #1a1a1a;
            --tag-hover-text: #ffffff;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.08);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            --font-serif: 'Georgia', 'Noto Serif SC', 'STSong', 'Songti SC', 'SimSun', serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.6;
            letter-spacing: 0.01em;
            padding: 0 20px;
            transition: padding var(--transition);
        }

        /* ========== Header ========== */
        .site-header {
            width: 100%;
            max-width: 780px;
            padding: 28px 0 12px;
            text-align: center;
            flex-shrink: 0;
        }

        .site-title {
            font-family: var(--font-serif);
            font-size: 1.6rem;
            font-weight: 400;
            letter-spacing: 0.06em;
            color: var(--text);
            line-height: 1.3;
        }

        .site-title .dot {
            display: inline-block;
            width: 5px;
            height: 5px;
            background: var(--accent);
            border-radius: 50%;
            margin: 0 6px;
            vertical-align: middle;
            position: relative;
            top: -2px;
        }

        .site-subtitle {
            font-size: 0.8rem;
            color: var(--text-tertiary);
            letter-spacing: 0.08em;
            margin-top: 4px;
            font-weight: 300;
        }

        /* ========== Main Container ========== */
        .main-container {
            width: 100%;
            max-width: 780px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
            transition: padding var(--transition);
        }

        .main-container.has-results {
            padding-top: 16px;
        }

        /* ========== Search Section ========== */
        .search-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all var(--transition);
        }

        .search-wrapper {
            position: relative;
            width: 100%;
            max-width: 540px;
            transition: all var(--transition);
        }

        .search-input {
            width: 100%;
            height: 56px;
            border: 1.5px solid var(--border);
            border-radius: 50px;
            padding: 0 52px 0 24px;
            font-size: 1.05rem;
            font-family: var(--font-sans);
            background: var(--surface);
            color: var(--text);
            letter-spacing: 0.03em;
            outline: none;
            transition: all var(--transition);
            box-shadow: var(--shadow-sm);
        }

        .search-input::placeholder {
            color: var(--text-tertiary);
            letter-spacing: 0.04em;
            font-weight: 300;
        }

        .search-input:focus {
            border-color: var(--border-hover);
            box-shadow: var(--shadow-md);
            outline: none;
        }

        .search-input:focus::placeholder {
            opacity: 0.5;
        }

        .search-btn {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
            flex-shrink: 0;
        }

        .search-btn:hover {
            background: #333;
            transform: translateY(-50%) scale(1.04);
        }

        .search-btn:active {
            transform: translateY(-50%) scale(0.96);
        }

        .search-btn svg {
            width: 18px;
            height: 18px;
            stroke: #fff;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .clear-btn {
            position: absolute;
            right: 56px;
            top: 50%;
            transform: translateY(-50%);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text-tertiary);
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: all var(--transition);
            line-height: 1;
        }

        .clear-btn.visible {
            display: flex;
        }

        .clear-btn:hover {
            color: var(--text);
            background: var(--tag-bg);
        }

        /* ========== Mood Tags ========== */
        .mood-tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            max-width: 540px;
            transition: all var(--transition);
        }

        .mood-tag {
            display: inline-block;
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 0.85rem;
            letter-spacing: 0.04em;
            cursor: pointer;
            background: var(--tag-bg);
            color: var(--text-secondary);
            border: none;
            font-family: var(--font-sans);
            transition: all var(--transition);
            user-select: none;
            white-space: nowrap;
            font-weight: 400;
        }

        .mood-tag:hover {
            background: var(--tag-hover-bg);
            color: var(--tag-hover-text);
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        .mood-tag:active {
            transform: scale(0.96);
        }

        .mood-tag.active-tag {
            background: var(--accent);
            color: #fff;
        }

        /* ========== Results Section ========== */
        .results-section {
            width: 100%;
            margin-top: 36px;
            display: none;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 40px;
            animation: fadeInUp 0.45s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .results-section.visible {
            display: flex;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .results-header {
            text-align: center;
            padding: 0 0 8px;
        }

        .results-mood-label {
            font-family: var(--font-serif);
            font-size: 1.3rem;
            letter-spacing: 0.05em;
            color: var(--text);
            font-weight: 400;
        }

        .results-count {
            font-size: 0.78rem;
            color: var(--text-tertiary);
            letter-spacing: 0.06em;
            margin-top: 2px;
        }

        /* ========== Perfume Card ========== */
        .perfume-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 22px 24px;
            transition: all var(--transition);
            position: relative;
            overflow: hidden;
            animation: cardIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            opacity: 0;
            box-shadow: var(--shadow-sm);
        }

        .perfume-card:nth-child(1) {
            animation-delay: 0.05s;
        }
        .perfume-card:nth-child(2) {
            animation-delay: 0.12s;
        }
        .perfume-card:nth-child(3) {
            animation-delay: 0.19s;
        }
        .perfume-card:nth-child(4) {
            animation-delay: 0.26s;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .perfume-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: var(--accent);
            border-radius: 0 3px 3px 0;
            opacity: 0;
            transition: opacity var(--transition);
        }

        .perfume-card:hover {
            border-color: var(--border-hover);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .perfume-card:hover::before {
            opacity: 1;
        }

        .perfume-card .card-header {
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }

        .perfume-card .perfume-name {
            font-family: var(--font-serif);
            font-size: 1.15rem;
            font-weight: 400;
            letter-spacing: 0.04em;
            color: var(--text);
            line-height: 1.3;
        }

        .perfume-card .perfume-brand {
            font-size: 0.78rem;
            color: var(--text-tertiary);
            letter-spacing: 0.06em;
            font-weight: 300;
        }

        .perfume-card .perfume-notes {
            font-size: 0.82rem;
            color: var(--text-secondary);
            letter-spacing: 0.03em;
            margin-bottom: 10px;
            font-style: italic;
            line-height: 1.5;
        }

        .perfume-card .perfume-reason {
            font-size: 0.9rem;
            color: var(--text);
            letter-spacing: 0.03em;
            line-height: 1.7;
            position: relative;
            padding-left: 14px;
            border-left: 1px solid var(--border);
            transition: border-color var(--transition);
        }

        .perfume-card:hover .perfume-reason {
            border-left-color: var(--border-hover);
        }

        /* ========== No Results ========== */
        .no-results {
            display: none;
            text-align: center;
            padding: 40px 20px;
            animation: fadeInUp 0.45s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .no-results.visible {
            display: block;
        }

        .no-results-icon {
            font-size: 2.5rem;
            margin-bottom: 12px;
            opacity: 0.6;
        }

        .no-results-title {
            font-family: var(--font-serif);
            font-size: 1.1rem;
            letter-spacing: 0.04em;
            color: var(--text);
            margin-bottom: 6px;
        }

        .no-results-text {
            font-size: 0.85rem;
            color: var(--text-tertiary);
            letter-spacing: 0.03em;
            line-height: 1.6;
        }

        .no-results .suggest-tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 16px;
        }

        /* ========== Footer ========== */
        .site-footer {
            width: 100%;
            max-width: 780px;
            text-align: center;
            padding: 20px 0 28px;
            font-size: 0.72rem;
            color: var(--text-tertiary);
            letter-spacing: 0.06em;
            flex-shrink: 0;
        }

        .site-footer span {
            opacity: 0.6;
        }

        /* ========== Responsive ========== */
        @media (max-width: 640px) {
            .site-title {
                font-size: 1.3rem;
                letter-spacing: 0.04em;
            }

            .site-subtitle {
                font-size: 0.7rem;
            }

            .main-container {
                padding-top: 24px;
            }

            .main-container.has-results {
                padding-top: 8px;
            }

            .search-input {
                height: 50px;
                font-size: 0.95rem;
                padding: 0 46px 0 18px;
                border-radius: 50px;
            }

            .search-btn {
                width: 36px;
                height: 36px;
                right: 5px;
            }

            .search-btn svg {
                width: 16px;
                height: 16px;
            }

            .clear-btn {
                right: 48px;
                width: 24px;
                height: 24px;
                font-size: 0.9rem;
            }

            .mood-tags {
                gap: 7px;
                margin-top: 14px;
            }

            .mood-tag {
                padding: 6px 14px;
                font-size: 0.78rem;
                letter-spacing: 0.03em;
            }

            .perfume-card {
                padding: 16px 18px;
                border-radius: var(--radius-sm);
            }

            .perfume-card .perfume-name {
                font-size: 1.05rem;
            }

            .perfume-card .perfume-reason {
                font-size: 0.82rem;
                padding-left: 10px;
            }

            .results-section {
                margin-top: 22px;
                gap: 12px;
            }

            .results-mood-label {
                font-size: 1.1rem;
            }
        }

        @media (max-width: 380px) {
            body {
                padding: 0 12px;
            }

            .search-input {
                height: 46px;
                font-size: 0.88rem;
                padding: 0 40px 0 14px;
            }

            .search-btn {
                width: 32px;
                height: 32px;
                right: 4px;
            }

            .clear-btn {
                right: 40px;
            }

            .mood-tag {
                padding: 5px 11px;
                font-size: 0.72rem;
            }

            .perfume-card {
                padding: 14px 15px;
            }

            .perfume-card .perfume-name {
                font-size: 0.95rem;
            }

            .perfume-card .perfume-reason {
                font-size: 0.78rem;
            }
        }
    </style>
</head>

                }]
            }, {

                keywords: ['冒险', '探索', 'adventure', '勇敢', '探索欲', '远方', '旅行', '未知', '出发', '挑战'],
                perfumes: [{

            }, {

                }, {

            }, {
                mood: '感恩',
                keywords: ['感恩', '温暖', '感谢', 'grateful', '谢谢', '珍惜', '幸福', '满足', '知足'],
                perfumes: [{
                    name: '经典古龙',

                    notes: '柑橘调 · 柠檬 · 薰衣草 · 迷迭香',
                    reason: '像清晨第一杯温热的柠檬水，简单却充满对生活的感激。最朴素的气息里，藏着最真挚的暖意。'
                }, {
                    name: '无极乌龙',
                    brand: 'Atelier Cologne',
                    notes: '茶香木质调 · 乌龙 · 佛手柑 · 愈创木',
                    reason: '午后阳光洒在书页上，手边一杯温热的乌龙。幸福本就如此简单——这茶香会提醒你珍惜每一个当下。'
                }]
            }, {
                mood: '焦虑',
                keywords: ['焦虑', '不安', 'anxious', '紧张', '烦躁', '心神不宁', '担忧', '压力', 'stress'],
                perfumes: [{
                    name: '薰衣草与麝香',
                    brand: 'Jo Malone',
                    notes: '馥奇调 · 薰衣草 · 白麝香 · 琥珀',
                    reason: '薰衣草的安神力量，像一双温柔的手轻轻抚平你皱起的眉头。深呼吸，让这宁静的香气帮你找回内心的节奏。'
                }, {
                    name: '玉龙茶香',
                    brand: 'Armani',
                    notes: '茶香调 · 绿茶 · 柑橘 · 茉莉',
                    reason: '一杯清茶的禅意，让纷乱的思绪慢慢沉淀。不急不躁，这清雅的茶香会陪你找回那份久违的从容。'
                }]
            }, {
                mood: '幸福',
                keywords: ['幸福', '满足', '甜蜜', 'fulfilled', '美好生活', '知足常乐', '温馨', '圆满'],
                perfumes: [{
                    name: '银泉',
                    brand: 'Creed',
                    notes: '水生木质调 · 佛手柑 · 绿茶 · 麝香',
                    reason: '像躺在草地上看云卷云舒，内心充盈着说不出的满足。幸福不需要理由，这香气就是最好的证明。'
                }, {
                    name: '花束',
                    brand: 'Floral Street',
                    notes: '花香调 · 牡丹 · 玫瑰 · 琥珀',
                    reason: '像收到一束不期而遇的鲜花，生活里的小确幸都藏在这芬芳里。每一缕香气都在说：你值得被这个世界温柔以待。'
                }]
            }];

            // ==================== DOM 元素引用 ====================
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            const clearBtn = document.getElementById('clearBtn');
            const resultsSection = document.getElementById('resultsSection');
            const noResults = document.getElementById('noResults');
            const suggestTags = document.getElementById('suggestTags');
            const moodTagsContainer = document.getElementById('moodTags');
            const mainContainer = document.getElementById('mainContainer');
            const allMoodTags = document.querySelectorAll('.mood-tag');

            // ==================== 状态管理 ====================
            let currentMood = null;
            let allMoods = perfumeDatabase.map(item => item.mood);

            // ==================== 工具函数 ====================
            function normalize(str) {
                return str.trim().toLowerCase().replace(/\s+/g, '');
            }

            function findMoodByKeyword(input) {
                const normalizedInput = normalize(input);
                if (!normalizedInput) return null;

                // 精确匹配心情名
                const exactMatch = perfumeDatabase.find(item =>
                    normalize(item.mood) === normalizedInput
                );
                if (exactMatch) return exactMatch;

                // 关键词匹配
                for (const item of perfumeDatabase) {
                    for (const kw of item.keywords) {
                        if (normalize(kw) === normalizedInput) {
                            return item;
                        }
                    }
                }

                // 模糊匹配（包含关系）
                const fuzzyMatches = perfumeDatabase.filter(item => {
                    const allTerms = [item.mood, ...item.keywords];
                    return allTerms.some(term => normalize(term).includes(normalizedInput));
                });

                if (fuzzyMatches.length === 1) return fuzzyMatches[0];
                if (fuzzyMatches.length > 1) return fuzzyMatches; // 返回数组

                // 反向模糊匹配（输入包含关键词）
                const reverseMatches = perfumeDatabase.filter(item => {
                    const allTerms = [item.mood, ...item.keywords];
                    return allTerms.some(term => normalizedInput.includes(normalize(term)));
                });

                if (reverseMatches.length === 1) return reverseMatches[0];
                if (reverseMatches.length > 1) return reverseMatches;

                return null;
            }

            // ==================== 渲染函数 ====================
            function renderPerfumeCards(perfumes) {
                return perfumes.map((p, index) => `
                    <article class="perfume-card" style="animation-delay: ${index * 0.07}s;">
                        <div class="card-header">
                            <span class="perfume-name">${escapeHTML(p.name)}</span>
                            <span class="perfume-brand">${escapeHTML(p.brand)}</span>
                        </div>
                        <p class="perfume-notes">${escapeHTML(p.notes)}</p>
                        <p class="perfume-reason">${escapeHTML(p.reason)}</p>
                    </article>
                `).join('');
            }

            function renderResults(moodData, queryText) {
                let allPerfumes = [];
                let moodLabel = '';

                if (Array.isArray(moodData)) {
                    // 多个心情匹配
                    moodData.forEach(md => {
                        allPerfumes = allPerfumes.concat(md.perfumes);
                    });
                    moodLabel = '多重心境 · 为你精选';
                } else {
                    allPerfumes = moodData.perfumes;
                    moodLabel = moodData.mood;
                }

                const html = `
                    <div class="results-header">
                        <p class="results-mood-label">${escapeHTML(moodLabel)}</p>
                        <p class="results-count">共 ${allPerfumes.length} 款推荐</p>
                    </div>
                    ${renderPerfumeCards(allPerfumes)}
                `;

                resultsSection.innerHTML = html;
                resultsSection.classList.add('visible');
                noResults.classList.remove('visible');
                mainContainer.classList.add('has-results');
            }

            function renderNoResults(queryText) {
                resultsSection.classList.remove('visible');
                resultsSection.innerHTML = '';
                noResults.classList.add('visible');
                mainContainer.classList.add('has-results');

                // 推荐热门标签
                const hotMoods = ['开心', '平静', '约会', '清新', '浪漫', '忧郁', '自信', '疲惫'];
                suggestTags.innerHTML = hotMoods.map(m =>
                    `<button class="mood-tag" data-mood="${m}" onclick="document.getElementById('searchInput').value='${m}';document.getElementById('searchBtn').click();">${m}</button>`
                ).join('');
            }

            function resetToInitial() {
                resultsSection.classList.remove('visible');
                resultsSection.innerHTML = '';
                noResults.classList.remove('visible');
                suggestTags.innerHTML = '';
                mainContainer.classList.remove('has-results');
                currentMood = null;
                searchInput.value = '';
                clearBtn.classList.remove('visible');
                updateActiveTag(null);
                searchInput.focus();
            }

            function escapeHTML(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            function updateActiveTag(activeMood) {
                allMoodTags.forEach(tag => {
                    const tagMood = tag.getAttribute('data-mood');
                    if (tagMood === activeMood) {
                        tag.classList.add('active-tag');
                    } else {
                        tag.classList.remove('active-tag');
                    }
                });
            }

            // ==================== 搜索逻辑 ====================
            function performSearch(queryText) {
                const trimmed = queryText.trim();

                if (!trimmed) {
                    resetToInitial();
                    return;
                }

                const result = findMoodByKeyword(trimmed);

                if (!result) {
                    // 无匹配
                    renderNoResults(trimmed);
                    currentMood = null;
                    updateActiveTag(null);
                } else if (Array.isArray(result)) {
                    // 多个匹配
                    renderResults(result, trimmed);
                    currentMood = null;
                    updateActiveTag(null);
                } else {
                    // 单个匹配
                    renderResults(result, trimmed);
                    currentMood = result.mood;
                    updateActiveTag(result.mood);
                }

                // 滚动到结果区域
                if (resultsSection.classList.contains('visible') || noResults.classList.contains(
                        'visible')) {
                    setTimeout(() => {
                        const target = resultsSection.classList.contains('visible') ?
                            resultsSection : noResults;
                        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }, 150);
                }
            }

            // ==================== 事件监听 ====================
            searchBtn.addEventListener('click', () => {
                performSearch(searchInput.value);
            });

            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    performSearch(searchInput.value);
                }
            });

            searchInput.addEventListener('input', () => {
                const val = searchInput.value;
                if (val.trim().length > 0) {
                    clearBtn.classList.add('visible');
                } else {
                    clearBtn.classList.remove('visible');
                    // 如果清空输入，恢复到初始状态
                    if (currentMood !== null || resultsSection.classList.contains('visible') || noResults
                        .classList.contains('visible')) {
                        resetToInitial();
                    }
                }
            });

            clearBtn.addEventListener('click', () => {
                resetToInitial();
            });

            // 心情标签点击
            moodTagsContainer.addEventListener('click', (e) => {
                const tag = e.target.closest('.mood-tag');
                if (!tag) return;
                const mood = tag.getAttribute('data-mood');
                if (mood) {
                    searchInput.value = mood;
                    clearBtn.classList.add('visible');
                    performSearch(mood);
                }
            });

            // 推荐标签点击（在无结果区域）
            suggestTags.addEventListener('click', (e) => {
                const tag = e.target.closest('.mood-tag');
                if (!tag) return;
                const mood = tag.getAttribute('data-mood');
                if (mood) {
                    searchInput.value = mood;
                    clearBtn.classList.add('visible');
                    performSearch(mood);
                }
            });

            // 点击页面空白处不重置，保持结果可见
            // 但点击logo区域可以回到顶部
            document.querySelector('.site-header').addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            // ==================== 初始化 ====================
            function init() {
                // 页面加载时聚焦搜索框
                setTimeout(() => {
                    searchInput.focus();
                }, 400);

                // 初始状态：无结果
                resetToInitial();
            }

            // ==================== 键盘快捷键 ====================
            document.addEventListener('keydown', (e) => {
                // ESC 键清除搜索
                if (e.key === 'Escape' && document.activeElement === searchInput && searchInput.value.trim()
                    .length > 0) {
                    resetToInitial();
                }
                // 斜杠键快速聚焦搜索框
                if (e.key === '/' && document.activeElement !== searchInput && document.activeElement
                    ?.tagName !== 'INPUT' && document.activeElement?.tagName !== 'TEXTAREA') {
                    e.preventDefault();
                    searchInput.focus();
                    searchInput.select();
                }
            });

            // ==================== 启动应用 ====================
            init();

            console.log('🫧 你今天闻起来真棒 — 心情香水推荐工具已就绪');
            console.log('💡 提示：输入心情词（如"开心""约会""平静"）或点击下方标签开始探索');
            console.log('⌨️  快捷键：按 / 快速聚焦搜索框，按 Esc 清除搜索');
            console.log('📦 内置 ' + perfumeDatabase.length + ' 种心情，共 ' + perfumeDatabase.reduce((acc, item) => acc +
                item.perfumes.length, 0) + ' 款香水推荐');
        })();
    </script>
